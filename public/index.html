<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Desenho Assinado</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <h1>Gerador de Desenho</h1>
    
    <div>
        <label for="numero">Número (1 a 100):</label>
        <input type="number" id="numero" min="1" max="100">
    </div>
    <div id="g_id_onload"
         data-client_id="955479568617-fvhbgnf2nhfaqga4fttlagdr593i0slt.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin" data-type="standard"></div>
    <div id="resultado" style="margin-top: 20px;"></div>
    <script src="script.js"></script>
</body>
</html>
